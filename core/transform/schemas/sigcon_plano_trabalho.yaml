fonte: sigcon_plano_trabalho
descricao: >
  Planos de trabalho do SIGCON-MG. Grão: 1 linha por plano de trabalho
  (cd_plano_trabalho).
grao:
- cd_plano_trabalho
colunas:
  data_hora:
  - plano_trabalho_data_cancelamento_sccg
  - plano_trabalho_data_cadastro
  - plano_trabalho_data_envio_sccg
  inteiro:
  - plano_trabalho_ano
  identificador:
  - plano_trabalho_codigo
  - plano_trabalho_codigo_execucao_no_exercicio
  - plano_trabalho_matricula_sccg_cancelamento
  - plano_trabalho_cnpj_concedente
  - plano_trabalho_cnpj_proponente
  texto:
  - plano_trabalho_titulo
  - plano_trabalho_objeto
  - plano_trabalho_justificativa
  - plano_trabalho_status
  - plano_trabalho_caracteristica
  - plano_trabalho_tipo
  # tp_instrumento_siafi mistura códigos e textos ('11', 'Convênio de
  # Entrada', 'Portaria'): mantém como vem, sem padronizar.
  - plano_trabalho_tipo_siafi
  - plano_trabalho_migrado_ou_novo
  - plano_trabalho_justificativa_sccg_cancelamento
  - plano_trabalho_cancelamento_sccg
  - plano_trabalho_altera_termo_aditivo
  - plano_trabalho_razao_social_concedente
sentinelas:
  plano_trabalho_objeto: ['null']
  plano_trabalho_justificativa: ['null']
  plano_trabalho_cnpj_concedente: ['0']
  plano_trabalho_cnpj_proponente: ['0']
renomear:
  plano_trabalho_codigo: cd_plano_trabalho  # PK
  plano_trabalho_titulo: nm_plano_trabalho
  plano_trabalho_objeto: tx_objeto
  plano_trabalho_justificativa: tx_justificativa
  plano_trabalho_codigo_execucao_no_exercicio: cd_execucao_exercicio
  plano_trabalho_status: ds_status_plano_trabalho
  plano_trabalho_caracteristica: ds_caracteristica_contrapartida
  plano_trabalho_tipo: tp_plano_trabalho
  plano_trabalho_tipo_siafi: tp_instrumento_siafi
  plano_trabalho_migrado_ou_novo: ds_origem_cadastro
  plano_trabalho_matricula_sccg_cancelamento: cd_matricula_cancelamento_sccg  # LGPD
  plano_trabalho_data_cancelamento_sccg: dh_cancelamento_sccg
  plano_trabalho_justificativa_sccg_cancelamento: tx_justificativa_cancelamento
  plano_trabalho_cancelamento_sccg: ds_cancelamento_sccg
  plano_trabalho_data_cadastro: dh_cadastro
  plano_trabalho_ano: nr_ano_plano_trabalho
  plano_trabalho_data_envio_sccg: dh_envio_sccg
  plano_trabalho_altera_termo_aditivo: ds_alteracao_termo_aditivo
  plano_trabalho_cnpj_concedente: nr_cnpj_concedente  # FK -> 17 (sigcon_concedente)
  plano_trabalho_razao_social_concedente: nm_concedente
  plano_trabalho_cnpj_proponente: nr_cnpj_proponente
