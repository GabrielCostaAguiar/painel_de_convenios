<form method="get" action="">
<div class="panel filters">
  <div class="filters-top">
    <div class="ttl">
      <svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
      Filtros da consulta
    </div>
    <div class="filters-actions">
      <a href="{{ url_limpar }}" class="btn ghost-danger">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        Limpar filtros
      </a>
      <button type="submit" class="btn primary">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        Aplicar
      </button>
    </div>
  </div>

  <div class="filter-grid">
    <div class="field">
      <label for="f-ano">Ano do instrumento</label>
      <select id="f-ano" name="ano">
        <option value="">Todos</option>
        {% for v in anos %}<option value="{{ v }}"{% if f.ano == v|stringformat:"s" %} selected{% endif %}>{{ v }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="f-nr_convenio">Código SIGCON</label>
      <input id="f-nr_convenio" name="nr_convenio" type="text" placeholder="ex.: CV 98/2020" value="{{ f.nr_convenio }}" autocomplete="off" list="lista-nr_convenio">
      <datalist id="lista-nr_convenio">
        {% for v in sigcons %}<option value="{{ v }}">{% endfor %}
      </datalist>
    </div>
    <div class="field">
      <label for="f-nr_siafi">Código SIAFI</label>
      <input id="f-nr_siafi" name="nr_siafi" type="text" placeholder="ex.: 9032193" value="{{ f.nr_siafi }}" autocomplete="off" list="lista-nr_siafi">
      <datalist id="lista-nr_siafi">
        {% for v in siafis %}<option value="{{ v }}">{% endfor %}
      </datalist>
    </div>
    <div class="field">
      <label for="f-proponente">Proponente</label>
      <input id="f-proponente" name="proponente" type="text" placeholder="Parte do nome" value="{{ f.proponente }}" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-concedente">Concedente</label>
      <input id="f-concedente" name="concedente" type="text" placeholder="Parte do nome" value="{{ f.concedente }}" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-caracteristica_contrapartida">Característica da contrapartida</label>
      <select id="f-caracteristica_contrapartida" name="caracteristica_contrapartida">
        <option value="">Todas</option>
        {% for v in caracteristicas_contrapartida %}<option value="{{ v }}"{% if f.caracteristica_contrapartida == v|stringformat:"s" %} selected{% endif %}>{{ v }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="f-situacao">Status do convênio</label>
      <select id="f-situacao" name="situacao">
        <option value="">Todos</option>
        {% for v in situacoes %}<option value="{{ v }}"{% if f.situacao == v|stringformat:"s" %} selected{% endif %}>{{ v }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="f-termo_aditivo">Termo aditivo</label>
      <select id="f-termo_aditivo" name="termo_aditivo">
        <option value="">Todos</option>
        {% for v in termos_aditivo %}<option value="{{ v }}"{% if f.termo_aditivo == v|stringformat:"s" %} selected{% endif %}>{{ v }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="f-instrumento">Instrumento (tipo)</label>
      <select id="f-instrumento" name="instrumento">
        <option value="">Todos</option>
        {% for v in instrumentos %}<option value="{{ v }}"{% if f.instrumento == v|stringformat:"s" %} selected{% endif %}>{{ v }}</option>{% endfor %}
      </select>
    </div>
  </div>
</div>
</form>
