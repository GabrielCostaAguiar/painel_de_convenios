[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
pythonpath = .

# Paginar queryset sem order_by faz o banco devolver as linhas em ordem
# indefinida: o mesmo registro pode sair em duas paginas e outro em nenhuma.
# Como erro, impede que uma tela nova volte a paginar sem ordenacao.
filterwarnings =
    error::django.core.paginator.UnorderedObjectListWarning
